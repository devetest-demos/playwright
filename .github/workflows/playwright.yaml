name: Build and Deploy to GKE

on:
  push: // uncomment these lines once the kubernetes deployment is ready
    branches:
    #- main
    #- uat
    - develop


jobs:
  run-test:
    name: Build and Publish
    runs-on: ubuntu-latest
    outputs: 
      jira_env: ${{ steps.jira-environment.outputs.jira_env }}
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    
    # Set environment
    - name: Set Environment
      run: |-
        ENVIRONMENT=$(
          case '${{ github.ref_name }}' in
            'uat') echo 'uat' ;;
            'develop') echo 'develop' ;;
            'main') echo 'prod' ;;
          esac
        )
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

    # Setup gcloud CLI
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v0

    # Set Docker Credentials
    - name: Set Docker Credentials
      run:  gcloud --quiet auth configure-docker

    # Build the Docker image
    - name: Build
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA" \
          --tag "gcr.io/$PROJECT_ID/$IMAGE:$ENVIRONMENT-latest" \
          --build-arg RELEASE="$GITHUB_SHA" \
          --build-arg ENVIRONMENT="$ENVIRONMENT" \
          .
    # Push the Docker image to Google Container Registry
    # - name: Publish // uncomment this line once the kubernetes deployment is ready
    #  run: docker push "gcr.io/$PROJECT_ID/$IMAGE" --all-tags // uncomment this line once the kubernetes deployment is ready
    
    # Set JIRA Environment value
    - name: Set JIRA Environment
      id: jira-environment
      run: echo "jira_env=rater-orchestration-$ENVIRONMENT" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    needs: build-publish
    runs-on: ubuntu-latest
    # environment: ${{ needs.build-publish.outputs.jira_env }} // uncomment this line once the kubernetes deployment is ready
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    # Set environment
    - name: Set Environment
      run: |-
        ENVIRONMENT=$(
          case '${{ github.ref_name }}' in
            'uat') echo 'uat' ;;
            'develop') echo 'develop' ;;
            'main') echo 'prod' ;;
          esac
        )
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

    # Setup gcloud CLI
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v0
      with:
        credentials_json: ${{ secrets.GKE_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v0

    # Get the GKE credentials so we can deploy to the cluster
    - name: Set Credentials
      uses: google-github-actions/get-gke-credentials@v0
      with:
        cluster_name: "sigo-${{ env.ENVIRONMENT }}"
        location: ${{ env.GKE_LOCATION }}

    # Deploy the Docker image to the GKE cluster
    # - name: Deploy // uncomment these lines once the kubernetes deployment is ready
      # run: |-
      #   kubectl set image deployment $ENVIRONMENT-rater-orchestration-deployment sigo-rater="gcr.io/$PROJECT_ID/$IMAGE:$GITHUB_SHA"
      #   kubectl rollout status deployment/$ENVIRONMENT-rater-deployment
